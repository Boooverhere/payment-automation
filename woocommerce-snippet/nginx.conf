# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name pay.iptvsup.com;

    # Certbot challenge — used to issue/renew SSL certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — secure reverse proxy to payment webhook
server {
    listen 443 ssl;
    server_name pay.iptvsup.com;

    # SSL certificate (issued by Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/pay.iptvsup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.iptvsup.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Only allow WooCommerce webhook and health check endpoints
    location /webhook/order {
        proxy_pass         http://payment:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /webhook/order-completed {
        proxy_pass         http://payment:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://payment:8000;
    }

    location /webhook/email-click {
        proxy_pass         http://payment:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Block everything else — no other URLs exposed
    location / {
        return 404;
    }
}
